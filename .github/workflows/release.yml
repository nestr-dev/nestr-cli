name: Release

# Release with scripts/release.sh: it merges the version bump through a PR and
# then pushes the v* tag on the merge commit, which triggers this workflow.
# A v* tag push is the only trigger. To retry a failed release, use "Re-run
# jobs" on that tag's run.
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  verify-version:
    name: Verify tag is on main and matches Cargo.toml
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Later jobs check out this exact commit, not the tag name: a bare name can
    # resolve to a branch of the same name, and a tag can move between jobs.
    outputs:
      sha: ${{ steps.on-main.outputs.sha }}
    steps:
      # Full history, so the ancestry check below sees all of main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0

      # Anyone with write access can push a v* tag on any commit, and the tag
      # alone signs and publishes a release. Only build commits that reached
      # main, which means they passed review and the required checks.
      - name: Check the tagged commit is on main
        id: on-main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "::error::$RELEASE_TAG ($(git rev-parse HEAD)) is not on main. Release with scripts/release.sh so the bump is merged first."
            exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check version match
        run: |
          TAG_VERSION=${RELEASE_TAG#v}
          CARGO_VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "Tag version: $TAG_VERSION"
          echo "Cargo.toml version: $CARGO_VERSION"
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Version mismatch! Tag is v$TAG_VERSION but Cargo.toml has $CARGO_VERSION"
            echo "Please update Cargo.toml version to $TAG_VERSION before tagging."
            exit 1
          fi
          echo "Version match confirmed."

  # build runs only after verify-version; advisories are gated on PRs to main by
  # lint.yml's `audit` job (see .github/workflows/lint.yml).
  build:
    name: Build (${{ matrix.target }})
    needs: verify-version
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-14
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-version.outputs.sha }}

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.94.1"
          targets: ${{ matrix.target }}

      # No rust-cache: signed release binaries are built from a clean slate,
      # never from a cache another run could have written.

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --version 0.2.5 --locked

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf "../../../nestr-${RELEASE_TAG#v}-${{ matrix.target }}.tar.gz" nestr
          cd ../../..

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          Compress-Archive -Path "target/${{ matrix.target }}/release/nestr.exe" -DestinationPath "nestr-$version-${{ matrix.target }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nestr-${{ matrix.target }}
          path: nestr-*
          if-no-files-found: error

  release:
    name: Create Release
    needs: [verify-version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-version.outputs.sha }}
        # required for the anchore/sbom-action workspace scan below

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          format: cyclonedx-json
          output-file: artifacts/nestr-sbom.cyclonedx.json

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum nestr-* > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign checksums
        run: |
          cosign sign-blob --yes \
            --bundle artifacts/checksums-sha256.txt.sigstore.json \
            artifacts/checksums-sha256.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: artifacts/*

  # Regenerate the Homebrew formula in nestr-dev/homebrew-tap from the published
  # checksums and push it. No-op (with a warning) until the HOMEBREW_TAP_TOKEN secret
  # — a PAT with contents:write on the tap repo — is configured.
  # HOMEBREW_TAP_TOKEN belongs in the `release` environment, whose deployment rule
  # admits only v* tags, so workflows on other refs can't read it.
  homebrew:
    name: Update Homebrew tap
    needs: [verify-version, release]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-version.outputs.sha }}

      - name: Render formula and push to the tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN not set — skipping Homebrew tap update."
            exit 0
          fi
          version="${TAG#v}"
          base="https://github.com/nestr-dev/nestr-cli/releases/download/${TAG}"
          curl -fsSL "${base}/checksums-sha256.txt" -o checksums.txt
          sha() { awk -v f="nestr-${version}-$1" '$2 == f { print $1 }' checksums.txt; }
          mac_arm="$(sha aarch64-apple-darwin.tar.gz)"
          mac_x86="$(sha x86_64-apple-darwin.tar.gz)"
          lnx_arm="$(sha aarch64-unknown-linux-musl.tar.gz)"
          lnx_x86="$(sha x86_64-unknown-linux-musl.tar.gz)"
          for v in "${mac_arm}" "${mac_x86}" "${lnx_arm}" "${lnx_x86}"; do
            if [ -z "${v}" ]; then
              echo "::error::missing checksum in checksums-sha256.txt"
              exit 1
            fi
          done
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/nestr-dev/homebrew-tap.git" tap
          sed -e "s/@@VERSION@@/${version}/g" \
              -e "s/@@MAC_ARM@@/${mac_arm}/g" \
              -e "s/@@MAC_X86@@/${mac_x86}/g" \
              -e "s/@@LNX_ARM@@/${lnx_arm}/g" \
              -e "s/@@LNX_X86@@/${lnx_x86}/g" \
              .github/homebrew/nestr-cli.rb.tmpl > tap/Formula/nestr-cli.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/nestr-cli.rb
          if git diff --cached --quiet; then
            echo "Formula already current — nothing to push."
          else
            git commit -m "nestr-cli ${version}"
            git push
          fi
